
[project]
name = "enterprise-ai-assistant"
version = "0.1.0"
description = "Enterprise AI Assistant using LangChain, LangGraph and MCP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=3.6.1",
    "langchain>=1.5.2",
    "langchain-google-genai>=4.5.2",
    "openai>=3.57.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[build-system]
requires = ["uv_build>=0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
